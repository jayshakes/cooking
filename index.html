<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHIPS iOS probe</title>
  <style>
    body { font: 15px/1.4 -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; background: #f4f4f5; color: #18181b; }
    main { max-width: 520px; margin: 0 auto; }
    section { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    h1 { font-size: 20px; margin: 0 0 4px; }
    h2 { font-size: 15px; margin: 0 0 8px; }
    .meta { font-size: 12px; color: #52525b; word-break: break-all; }
    button { font: inherit; padding: 10px 12px; margin: 4px 4px 0 0; border: 0; border-radius: 8px; background: #2563eb; color: #fff; }
    button.secondary { background: #e4e4e7; color: #18181b; }
    table { width: 100%; border-collapse: collapse; }
    td { padding: 6px 4px; border-top: 1px solid #e4e4e7; vertical-align: top; }
    td:first-child { font-family: ui-monospace, monospace; white-space: nowrap; }
    .yes { color: #15803d; font-weight: 600; }
    .no { color: #b91c1c; font-weight: 600; }
    #verdict { font-weight: 600; }
    #log { font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; max-height: 320px; overflow: auto; }
    label { font-size: 14px; }
  </style>
</head>
<body>
<main>
  <section>
    <h1>CHIPS iOS probe</h1>
    <div class="meta" id="env"></div>
  </section>

  <section>
    <h2>Cookies the API received on the last check</h2>
    <table>
      <tr><td>pp_auth</td><td id="c-pp_auth">–</td><td>Partitioned, 120 s</td></tr>
      <tr><td>pp_remember</td><td id="c-pp_remember">–</td><td>Partitioned, 90 days</td></tr>
      <tr><td>np_control</td><td id="c-np_control">–</td><td>Not partitioned (control)</td></tr>
    </table>
    <p id="verdict"></p>
  </section>

  <section>
    <label><input type="checkbox" id="remember" checked> Remember me (sets pp_remember)</label><br>
    <button onclick="signIn()">Sign in</button>
    <button onclick="check('manual check')">Check</button>
    <button onclick="roundTrip()">Redirect round trip</button>
    <button class="secondary" onclick="signOut()">Sign out</button>
    <button class="secondary" onclick="clearLog()">Clear log</button>
  </section>

  <section>
    <h2>Log (kept on this page across visits)</h2>
    <div id="log"></div>
  </section>
</main>

<script>
  // --- FILL THIS IN before publishing (exact origin, no trailing slash) ---
  const API_ORIGIN = 'https://chips-test.shikongo-tj.workers.dev';

  const LOG_KEY = 'chips-probe-log';
  const NAMES = ['pp_auth', 'pp_remember', 'np_control'];

  function fmtAge(s) {
    if (s == null) return '';
    if (s < 120) return s + ' s';
    if (s < 7200) return Math.round(s / 60) + ' min';
    if (s < 172800) return (s / 3600).toFixed(1) + ' h';
    return (s / 86400).toFixed(1) + ' days';
  }

  function log(line) {
    const entries = JSON.parse(localStorage.getItem(LOG_KEY) || '[]');
    entries.unshift(new Date().toISOString() + '  ' + line);
    localStorage.setItem(LOG_KEY, JSON.stringify(entries.slice(0, 200)));
    renderLog();
  }
  function renderLog() {
    document.getElementById('log').textContent = JSON.parse(localStorage.getItem(LOG_KEY) || '[]').join('\n');
  }
  function clearLog() { localStorage.removeItem(LOG_KEY); renderLog(); }

  function show(me) {
    const ages = { pp_auth: me.authAgeSeconds, pp_remember: me.rememberAgeSeconds, np_control: me.controlAgeSeconds };
    for (const n of NAMES) {
      const got = me.received.includes(n);
      const el = document.getElementById('c-' + n);
      el.className = got ? 'yes' : 'no';
      el.textContent = got ? 'received (' + fmtAge(ages[n]) + ')' : 'not received';
    }
    const p = me.received.includes('pp_remember') || me.received.includes('pp_auth');
    const np = me.received.includes('np_control');
    let v;
    if (p && !np) v = 'Partitioned cookie came back, unpartitioned control did not: partitioning is what kept it.';
    else if (p && np) v = 'Both came back: third-party cookies are NOT being blocked, so this run proves nothing about partitioning. Check Prevent Cross-Site Tracking is on.';
    else if (!p && np) v = 'Only the unpartitioned control came back: unexpected, record it.';
    else v = 'Nothing came back (signed out, expired, or dropped).';
    document.getElementById('verdict').textContent = v;
  }

  async function check(label) {
    try {
      const res = await fetch(API_ORIGIN + '/me', { credentials: 'include', cache: 'no-store' });
      const me = await res.json();
      show(me);
      log(label + ': received [' + me.received.join(', ') + ']'
        + (me.rememberAgeSeconds != null ? ' remember-age=' + fmtAge(me.rememberAgeSeconds) : ''));
      return me;
    } catch (e) {
      log(label + ': ERROR ' + e);
    }
  }

  async function signIn() {
    try {
      const remember = document.getElementById('remember').checked;
      const res = await fetch(API_ORIGIN + '/login', {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ remember }),
      });
      log('sign in: HTTP ' + res.status + (remember ? ' (remember on)' : ' (remember off)'));
      await check('check after sign in');
    } catch (e) {
      log('sign in: ERROR ' + e);
    }
  }

  async function signOut() {
    try {
      const res = await fetch(API_ORIGIN + '/logout', { method: 'POST', credentials: 'include' });
      log('sign out: HTTP ' + res.status);
      await check('check after sign out');
    } catch (e) {
      log('sign out: ERROR ' + e);
    }
  }

  // Top-level navigation: page -> API Worker /bounce -> bounce site -> back here (?rt=1).
  async function roundTrip() {
    await check('before round trip');
    const back = location.origin + location.pathname + '?rt=1';
    log('round trip: leaving page');
    location.href = API_ORIGIN + '/bounce?back=' + encodeURIComponent(back);
  }

  window.onload = async () => {
    document.getElementById('env').textContent =
      'Page: ' + location.origin + ' · API: ' + API_ORIGIN + ' · ' + navigator.userAgent;
    renderLog();
    const params = new URLSearchParams(location.search);
    if (params.get('rt') === '1') {
      history.replaceState(null, '', location.pathname);
      await check('AFTER round trip');
    } else {
      await check('page load');
    }
  };
</script>
</body>
</html>
