<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHIPS Widget Validator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <!-- Main Widget Container -->
  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
    
    <!-- Login View -->
    <div id="loginView" class="block">
      <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Login to Widget</h2>
      <p class="text-sm text-gray-500 mb-4 text-center">Use 111, 222, 333, 444, or 555</p>
      
      <input type="text" id="codeInput" maxlength="3" placeholder="Enter 3-digit code" 
             class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4 text-center text-xl tracking-widest">
      
      <button onclick="login()" id="loginBtn"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
        Login
      </button>
      <p id="errorMsg" class="text-red-500 text-center mt-4 hidden text-sm font-medium"></p>
    </div>

    <!-- Dashboard View (Logged In) -->
    <div id="dashboardView" class="hidden text-center">
      <div class="text-6xl mb-4" id="userAvatar"></div>
      <h2 class="text-2xl font-bold text-gray-800" id="userName"></h2>
      <p class="text-md text-blue-600 font-semibold mb-6" id="userRole"></p>
      
      <div class="bg-gray-50 p-4 rounded-lg mb-6 border border-gray-200">
        <p class="text-sm text-gray-500">Session Duration</p>
        <p class="text-3xl font-mono text-gray-800 mt-1" id="durationDisplay">00:00</p>
        <p class="text-xs text-green-600 mt-2 font-semibold">✅ CHIPS Cookie Active</p>
      </div>

      <button onclick="logout()" 
              class="w-full bg-red-100 hover:bg-red-200 text-red-600 font-bold py-3 px-4 rounded-lg transition duration-200">
        Logout
      </button>
    </div>

  </div>

  <script>
    // --- REPLACE THIS WITH YOUR WORKER URL ---
    const WORKER_URL = 'https://chips-test.shikongo-tj.workers.dev';
    
    let durationInterval;

    // Helper to format seconds into MM:SS
    function formatTime(totalSeconds) {
      const m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
      const s = (totalSeconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    // Toggle UI views
    function showView(view) {
      document.getElementById('loginView').style.display = view === 'login' ? 'block' : 'none';
      document.getElementById('dashboardView').style.display = view === 'dashboard' ? 'block' : 'none';
    }

    // Show error message
    function showError(msg) {
      const errEl = document.getElementById('errorMsg');
      if (msg) {
        errEl.innerText = msg;
        errEl.classList.remove('hidden');
      } else {
        errEl.classList.add('hidden');
      }
    }

    // Check if user is already logged in (reads CHIPS cookie)
    async function checkSession() {
      try {
        const res = await fetch(`${WORKER_URL}/me`, { credentials: 'include' });
        const data = await res.json();
        
        if (data.loggedIn) {
          populateDashboard(data.user, data.durationSeconds);
        } else {
          showView('login');
        }
      } catch (err) {
        console.error("Session check failed:", err);
        showView('login');
      }
    }

    // Handle Login
    async function login() {
      const code = document.getElementById('codeInput').value;
      showError('');
      
      if(code.length !== 3) {
        showError('Please enter a 3-digit code.');
        return;
      }

      const btn = document.getElementById('loginBtn');
      btn.innerText = 'Loading...';

      try {
        const res = await fetch(`${WORKER_URL}/login`, {
          method: 'POST',
          credentials: 'include', // Crucial for storing the CHIPS cookie
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code })
        });
        
        const data = await res.json();
        
        if (res.ok) {
          populateDashboard(data.user, 0); // Start at 0 seconds on fresh login
        } else {
          showError(data.error || 'Login failed');
        }
      } catch (err) {
        showError('Network error. Check console.');
        console.error(err);
      } finally {
        btn.innerText = 'Login';
      }
    }

    // Handle Logout
    async function logout() {
      try {
        await fetch(`${WORKER_URL}/logout`, {
          method: 'POST',
          credentials: 'include' // Crucial for clearing the CHIPS cookie
        });
        
        clearInterval(durationInterval);
        document.getElementById('codeInput').value = '';
        showView('login');
      } catch (err) {
        console.error("Logout failed:", err);
      }
    }

    // Populate dashboard and start timer
    function populateDashboard(user, startingSeconds) {
      document.getElementById('userName').innerText = user.name;
      document.getElementById('userRole').innerText = user.role;
      document.getElementById('userAvatar').innerText = user.avatar;
      
      let currentSeconds = startingSeconds;
      const display = document.getElementById('durationDisplay');
      display.innerText = formatTime(currentSeconds);
      
      clearInterval(durationInterval);
      durationInterval = setInterval(() => {
        currentSeconds++;
        display.innerText = formatTime(currentSeconds);
      }, 1000);

      showView('dashboard');
    }

    // Check session on load
    window.onload = checkSession;
  </script>
</body>
</html>
